<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Natural Project</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#050505;
  color:white;
  text-align:center;
}

.container {
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.progress-shell {
  width:100%;
  height:24px;
  border-radius:999px;
  background:#222;
  overflow:hidden;
  margin:20px 0;
}

.progress-fill {
  height:100%;
  width:0%;
  background:#1db954;
  transition: width 0.6s ease;
}

.stat {
  margin:10px 0;
  font-size:20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>The Natural Project</h1>

  <h2 id="percent">0%</h2>

  <div class="progress-shell">
    <div class="progress-fill" id="bar"></div>
  </div>

  <div class="stat">Current: <span id="current">Loading...</span></div>
  <div class="stat">Goal: 3,000,000,000</div>
  <div class="stat">Remaining: <span id="remaining">Loading...</span></div>

  <p id="note">Loading...</p>
</div>

<script>
const API_URL = "/.netlify/functions/natural-streams";
const GOAL = 3000000000;

function format(n){
  return new Intl.NumberFormat().format(n);
}

function update(data){
  const current = data.currentStreams || 0;
  const percent = Math.round((current / GOAL) * 100);
  const remaining = Math.max(GOAL - current, 0);

  document.getElementById("current").textContent = format(current);
  document.getElementById("remaining").textContent = format(remaining);
  document.getElementById("percent").textContent = percent + "%";
  document.getElementById("bar").style.width = percent + "%";

  document.getElementById("note").textContent =
    data.note || "Last updated: " + new Date(data.updatedAt).toLocaleString();
}

async function load(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    update(data);
  }catch(e){
    document.getElementById("note").textContent = "Error loading data";
  }
}

load(); // ONLY loads once (no spam)
</script>

</body>
</html>
